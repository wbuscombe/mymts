[project]
name = "mymts-helper"
version = "0.0.0"
description = "MyMTS helper — minimal NAS-side service. Aggregates news + resolves live-stream addresses. Nothing else."
requires-python = ">=3.13"
license = { file = "../LICENSE" }
authors = [{ name = "Will Buscombe" }]
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.8.4",
]

[project.scripts]
mymts-helper = "mymts_helper.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mymts_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RET", "SIM"]
ignore = ["S101"]  # asserts in tests are fine

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]
