[project]
name = "mymts-helper"
version = "0.0.0"
description = "MyMTS helper — minimal NAS-side service. Aggregates news + resolves live-stream addresses. Nothing else."
requires-python = ">=3.13"
# SPDX expression (PEP 639). Avoids the relative path to ../LICENSE that
# breaks under Docker build contexts.
license = "MIT"
authors = [{ name = "Will Buscombe" }]
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "httpx==0.28.1",
    "feedparser==6.0.11",
    "defusedxml==0.7.1",
    # yt-dlp YouTube-live resolver (kind='youtube'). PINNED — YouTube changes
    # its player API often and yt-dlp ships fixes on a fast cadence, so this
    # pin needs a PERIODIC BUMP (a stale yt-dlp silently stops resolving
    # YouTube channels). Base package has no required runtime deps. See
    # CHANGELOG "yt-dlp YouTube-live resolver" + channels/youtube_resolver.py.
    "yt-dlp==2026.3.17",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "respx==0.22.0",
    "ruff==0.8.4",
]

[project.scripts]
mymts-helper = "mymts_helper.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mymts_helper"]
# Migrations directory + seed.json are auto-included as package data because
# they live inside src/mymts_helper. (Earlier explicit force-include here
# duplicated the inclusion and was rejected by hatchling >= 1.30.)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "error",
    # feedparser triggers SyntaxWarnings (invalid escapes in their regex
    # strings) and the sgmllib3k shim warns about deprecated patterns. Both
    # are upstream noise we can't fix and shouldn't gate on.
    "ignore::SyntaxWarning:feedparser",
    "ignore::DeprecationWarning:feedparser",
    # ResourceWarnings fire during GC (long after the leaking test has
    # finished) and surface against an arbitrary "next" test, which makes
    # them useless as a gate. We rely on code review + explicit close()
    # discipline instead.
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RET", "SIM"]
ignore = [
    "S101",  # asserts in tests are fine
    "B008",  # Depends() in defaults is the idiomatic FastAPI pattern
    "SIM105", # contextlib.suppress is overkill for one-line try/except/pass
    "S110",  # try/except/pass in poller-stop is intentional cleanup quieting
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]
"src/mymts_helper/channels/registry.py" = ["S608"]  # SQL strings here use safe prefix-only concatenation
