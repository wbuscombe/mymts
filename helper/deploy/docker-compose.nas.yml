# MyMTS Helper — NAS deploy.
#
# Layout (operator standard, ${MYMTS_HELPER_REMOTE_PATH:-/srv/mymts-helper}):
#   /srv/mymts-helper/
#     compose.yml          (symlink to or copy of this file)
#     data/                (sqlite + future state — bind-mounted)
#     .env                 (PHANTOM_MODE/BUILD_SHA/BUILD_VERSION/LOG_LEVEL)
#
# Hardening (Trust Bar A2/A4/A7 + Op Bar B/C):
#   - non-root container (uid 10001 set by image),
#   - read-only rootfs with tmpfs for /tmp,
#   - all capabilities dropped, no-new-privileges,
#   - CPU + memory caps,
#   - internal Docker network — never published to a host port; the TV
#     reaches the helper through the NAS network, not the public internet,
#   - secrets injected at runtime via .env (never baked into the image).
#
# Unrelated services/containers sharing the helper's host are NEVER
# referenced or networked into; the helper runs isolated on its own
# network. Standing rule.

services:
  helper:
    container_name: mymts-helper
    image: mymts-helper:${BUILD_VERSION:-0.0.0-dev}
    build:
      # On the helper host this resolves to
      # ${MYMTS_HELPER_REMOTE_PATH:-/srv/mymts-helper}/_src/ which is the
      # rsynced helper/ tree from the dev machine.
      context: ./_src
      args:
        BUILD_SHA: ${BUILD_SHA:-dev}
        BUILD_VERSION: ${BUILD_VERSION:-0.0.0-dev}
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=8m,uid=10001,gid=10001
    cpus: 1.0
    # 384m → 512m (2026-07-13). The "2 VLC viewers crashed something" investigation
    # found NO crash (RestartCount=0, no OOM) and proved the stream path is cleanly
    # concurrent (N=1–4 readers: 0 errors, 0 restarts, memory flat) — so this is NOT a
    # concurrency fix. But it surfaced that the helper runs permanently at ~353 MiB
    # ANONYMOUS (unreclaimable) heap, i.e. `memory.current` ≈ 379/384 MiB = 98.7% with
    # only ~5 MiB headroom, touching 98.45% under 4 concurrent readers. Running a
    # service that tight to its OOM cap is fragile: any transient spike (GC timing, a
    # large feed parse, a new radar region) could trip an OOM-kill — which WOULD look
    # exactly like the reported "crash" (the stream dies for every viewer at once).
    # With 2+ simultaneous viewers now an expected use case, give it real headroom.
    # Low-risk: the NAS has ample RAM (the renderer alone gets 4g); still bounded so
    # the helper can never starve the host. Watch for slow creep toward 512m (would
    # indicate a real leak worth profiling, distinct from this steady working set).
    mem_limit: 512m
    environment:
      PHANTOM_MODE: ${PHANTOM_MODE:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATA_DIR: /data
      BUILD_SHA: ${BUILD_SHA:-dev}
      BUILD_VERSION: ${BUILD_VERSION:-0.0.0-dev}
      FEED_POLL_INTERVAL_SECONDS: ${FEED_POLL_INTERVAL_SECONDS:-300}
      FEED_RETENTION_DAYS: ${FEED_RETENTION_DAYS:-14}
      CHANNEL_PROBE_INTERVAL_SECONDS: ${CHANNEL_PROBE_INTERVAL_SECONDS:-1800}
      # Stage 6 / TLS cutover (2026-06-04, operator at the box).
      # The helper now serves HTTPS only — the transitional HTTP 8091
      # path was removed after telemetry verified the TV app reaches
      # the helper over HTTPS exclusively. `PORT` is intentionally
      # unset; with only HTTPS_PORT configured, the entry point flips
      # the HTTPS listener's lifespan to "on" and starts the pollers
      # there (one listener, one app instance, no double-start).
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      SSL_KEYFILE: ${SSL_KEYFILE:-/etc/ssl/mymts/helper.key}
      SSL_CERTFILE: ${SSL_CERTFILE:-/etc/ssl/mymts/helper.crt}
      # LAN web client (2026-06-06). When set, the helper serves the
      # static client at /app (same-origin → no CORS; mounted last so it
      # can't shadow /api/*). The files arrive via the read-only bind
      # mount below. Opt-in via .env; defaults on for this deploy since
      # the operator is enabling it. Set WEB_CLIENT_DIR= (empty) in .env
      # to disable without removing the mount.
      WEB_CLIENT_DIR: ${WEB_CLIENT_DIR:-/app/web}
      # Renderer HLS (headless-container version). The renderer writes its HLS
      # to the shared mymts-stream volume; the helper serves it at /api/stream
      # (one LAN listener) for VLC / Apple TV. Read-only mount below.
      STREAM_DIR: ${STREAM_DIR:-/stream}
      # Plain-HTTP, stream-ONLY listener (2026-06-25): a strict tvOS VLC hangs on
      # the self-signed HTTPS, so the HLS is ALSO served over plain HTTP on this
      # LAN port (the same hardened /api/stream route; API/control/app stay HTTPS).
      STREAM_HTTP_PORT: ${STREAM_HTTP_PORT:-8082}
    volumes:
      # Named volume (Docker-managed) avoids host-side permission churn
      # for the non-root container user. State lives at
      # /var/lib/docker/volumes/mymts-helper-data/_data on the helper host;
      # backup/restore commands are documented in
      # docs/OPERATIONS.md "Helper backup/restore".
      - mymts-helper-data:/data:rw
      # TLS cert + private key — operator-supplied on the helper host at
      # ${MYMTS_HELPER_REMOTE_PATH:-/srv/mymts-helper}/_secrets/. NEVER in
      # the repo. Mounted read-only (`:ro`) so a compromised container
      # cannot rewrite the key; ownership inside the container is
      # 10001:10001 to match the non-root user.
      - ${MYMTS_HELPER_REMOTE_PATH:-/srv/mymts-helper}/_secrets:/etc/ssl/mymts:ro
      # LAN web client static files — the repo-root `web/` tree, rsynced
      # by deploy-helper.sh to `_web/` on the helper host. Mounted
      # READ-ONLY: the client is inert static files (HTML/CSS/JS),
      # credential-free, and the container can never rewrite them. Served
      # at /app via WEB_CLIENT_DIR above. (web/ is a repo-root sibling of
      # helper/, so it is NOT in the image build context — a bind mount is
      # how it reaches the container without an image rebuild for web edits.)
      - ${MYMTS_HELPER_REMOTE_PATH:-/srv/mymts-helper}/_web:/app/web:ro
      # Renderer HLS output — the shared volume the renderer writes (rw) and the
      # helper serves READ-ONLY. A compromised helper cannot write the stream;
      # a compromised renderer cannot reach the helper's data/cert volumes.
      - mymts-stream:/stream:ro
    networks:
      # mymts-net: the helper + renderer's own bridge (TV/LAN + renderer reach the
      # helper here).
      - mymts-net
    # HTTPS-only as of 2026-06-04. The TV on the LAN reaches /api/feed
    # + /api/channels at https://<nas-lan-ip>:8443. LAN-only; the
    # container is still non-root + cap-dropped + read-only-rootfs.
    ports:
      - "8443:8443"
      # Plain-HTTP HLS stream (stream-only app) for strict LAN players (Apple TV
      # VLC). LAN-bound; serves ONLY the hardened /api/stream route, no API/keys.
      - "8082:8082"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Healthcheck now hits HTTPS over loopback. `-k` skips cert
      # verification — the container is fetching from itself, so MITM
      # is not a concern; we just want to know if the listener is up.
      test: ["CMD", "curl", "-fsSk", "https://127.0.0.1:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- renderer (headless-container version, second half) ----
  # Runs the config-driven web wall (/app/?render=1) on a virtual display and
  # streams the composited video + the audible cell's audio as HLS to the shared
  # mymts-stream volume; the helper serves it at /api/stream for VLC / Apple TV.
  # Same mymts-net as the helper → egress is the SAME residential WAN path the
  # helper uses (the helper + the public HLS the tiles play). No baked secrets.
  renderer:
    container_name: mymts-renderer
    image: mymts-renderer:${BUILD_VERSION:-0.0.0-dev}
    build:
      # Rsynced to ${MYMTS_HELPER_REMOTE_PATH}/_renderer/ by deploy-helper.sh.
      context: ./_renderer
      args:
        BUILD_SHA: ${BUILD_SHA:-dev}
        BUILD_VERSION: ${BUILD_VERSION:-0.0.0-dev}
    restart: unless-stopped
    depends_on:
      - helper
    # NOT read-only-rootfs: Chromium needs writable profile/cache + the X socket
    # + the Pulse runtime dir — all confined to tmpfs (/tmp) below. Chromium runs
    # --no-sandbox (it only ever loads OUR OWN same-origin /app/), so the Linux
    # sandbox caps aren't needed and ALL capabilities are dropped.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # Chromium profile/cache, the Xvfb socket, and the Pulse runtime dir all
      # live here; sized for Chromium's churn. Software x264 + N decoders are the
      # heavy part — bounded by the cpus/mem caps so it can't starve the NAS.
      # Sized for 4K Chromium compositing (--disable-dev-shm-usage routes shm here).
      - /tmp:size=1g
    shm_size: 512m
    # HARD ceilings (these are the renderer's OWN limits — no other container is
    # touched). Headroom for the opt-in 4K canvas: a 4K software x264 encode + 4K
    # Chromium compositing need more cores/RAM than 1080p. Still strictly bounded
    # on the multi-core NAS so 4K can never starve the host or PIA — worst case the
    # 4K stream drops frames. 1080p uses only ~2 cores / ~1g, well under these.
    cpus: 6.0
    mem_limit: 4g
    environment:
      # The config-driven wall in render mode (?render=1 hides chrome + cursor).
      # The helper is on the same Docker network → reachable by container name
      # over HTTPS (self-signed; Chromium runs with --ignore-certificate-errors).
      HELPER_URL: ${RENDER_HELPER_URL:-https://mymts-helper:8443/app/?render=1}
      STREAM_DIR: /stream
      # Render canvas. The wall config's `render.resolution` — one of an 8-rung
      # 16:9 ladder (720p…2160p), set in /control/ — is AUTHORITATIVE and drives
      # WIDTH/HEIGHT/fps/bitrate/bufsize at startup; these env values are only the
      # FALLBACK when the helper is unreachable at boot (config > env > default). A
      # resolution change restarts the renderer stack (a brief stream blip) to
      # re-size Xvfb/ffmpeg. Per-rung fps/bitrate live in supervisor.RENDER_FPS /
      # RENDER_BITRATES and are AUTHORITATIVE — above the ~1080p/30 ceiling each rung
      # targets its SUSTAINABLE CFR (e.g. 1440p@20, 2160p@10) so the wall is
      # consistent rather than juddery (the browser is render-bound on a CPU-only
      # renderer — ARCHITECTURE §31; RENDER_FPS env only matters on the boot
      # fallback path). The grab queue is memory-bounded per rung (supervisor.
      # grab_queue_size) so a high-res stream drops frames within mem_limit, never
      # OOMs. Higher rungs are opt-in + CPU-heavy: hard-capped at cpus:6.0 below so
      # they can NEVER starve the NAS. Default stays 1080p@30. (shm_size + tmpfs /tmp
      # below — 512m / 1g — are sized for the 4K canvas; raise only if a high rung
      # logs shm/compositor allocation failures.)
      RENDER_WIDTH: ${RENDER_WIDTH:-1920}
      RENDER_HEIGHT: ${RENDER_HEIGHT:-1080}
      RENDER_FPS: ${RENDER_FPS:-30}
      RENDER_VIDEO_BITRATE: ${RENDER_VIDEO_BITRATE:-8M}
      RENDER_BUFSIZE: ${RENDER_BUFSIZE:-16M}
      RENDER_X264_PRESET: ${RENDER_X264_PRESET:-veryfast}
      BUILD_SHA: ${BUILD_SHA:-dev}
      BUILD_VERSION: ${BUILD_VERSION:-0.0.0-dev}
    volumes:
      - mymts-stream:/stream:rw
    networks:
      - mymts-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mymts-net:
    name: mymts-net
    driver: bridge
    # NOT internal — the poller + prober need outbound HTTP to reach RSS
    # sources and HLS upstreams. Bounded egress (a Squid-style allowlist)
    # is a Stage 6 hardening item; for v1 the SSRF guard in the fetcher
    # prevents the poller from being turned into a pivot.

volumes:
  mymts-helper-data:
    name: mymts-helper-data
  # Shared HLS stream: renderer writes (rw), helper serves (ro). Docker-managed
  # so the non-root users on both sides write/read without host permission churn.
  mymts-stream:
    name: mymts-stream
