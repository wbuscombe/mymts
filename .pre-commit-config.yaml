# Pre-commit secret scanning — keeps secrets out of commits (history is verified
# clean; this stops a regression). Install once: `pip install pre-commit && pre-commit install`.
# Run on demand: `pre-commit run --all-files`.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: gitleaks (block secrets)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key       # belt-and-braces: no private keys, ever
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=2048"]
