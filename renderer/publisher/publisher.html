<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MyMTS Mercury Publisher</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #555;
      font: 11px system-ui, sans-serif; overflow: hidden; }
    /* Headless-on-Xvfb; never seen. A hidden <video> plays the wall's HLS (the single
       render) and is captureStream()'d into the Mercury screen_share track. */
    #wall { position: absolute; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
    #log { position: fixed; inset: 0; padding: 6px; opacity: 0.15; white-space: pre-wrap; }
  </style>
  <!-- Vendored same-origin (served by the localhost control server), no CDN.
       hls.js (UMD → window.Hls) plays the render; livekit-client (UMD →
       window.LivekitClient) publishes it. -->
  <script src="vendor/hls.min.js"></script>
  <script src="vendor/livekit-client.umd.js"></script>
</head>
<body>
  <video id="wall" autoplay muted playsinline></video>
  <div id="log"></div>
  <script src="publisher.js"></script>
</body>
</html>
