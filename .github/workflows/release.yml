# Multi-OS desktop release — build the MyMTS desktop app on macOS / Windows /
# Linux with PyInstaller and, on a version tag, create a DRAFT GitHub Release with
# the three artifacts. This is ADDITIVE to ci.yml (tests + docs-hygiene stay intact).
#
# Triggers: a `v*` tag (creates a draft Release) or manual dispatch (builds only).
#
# Release decisions (deliberate, not gaps):
#   - Desktop artifacts ship UNSIGNED. No signing or notarization runs here.
#   - The Android APK is signed locally and attached manually. The keystore is
#     deliberately kept off CI, so this workflow builds no APK.
#   - The release is created as a DRAFT and published only after the signed APK
#     is attached and verified.
# Manual APK path: build and sign the release APK locally, confirm it with
# `apksigner verify`, attach it with `gh release upload <tag> mymts-<version>.apk`,
# check the draft's assets and body, then publish the draft.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: MyMTS-macos.zip
          - os: windows-latest
            artifact: MyMTS-windows.zip
          - os: ubuntu-latest
            artifact: MyMTS-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps (helper + build tooling)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ./helper                 # mymts_helper + fastapi/uvicorn/yt-dlp
          pip install pyinstaller pystray Pillow

      - name: Linux tray-import dep (so pystray imports during build)
        if: runner.os == 'Linux'
        run: pip install python-xlib

      - name: Build (PyInstaller)
        shell: bash
        working-directory: tools/desktop
        run: pyinstaller mymts-helper.spec --noconfirm --clean

      # --- smoke test: the artifact must actually RUN, not just build (catches
      #     missing runtime deps / hidden imports — the Linux risk especially) ---
      - name: Smoke test (headless serve + /health)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   BIN="tools/desktop/dist/MyMTS.app/Contents/MacOS/MyMTS" ;;
            Windows) BIN="tools/desktop/dist/MyMTS/MyMTS.exe" ;;
            *)       BIN="tools/desktop/dist/MyMTS/MyMTS" ;;
          esac
          MYMTS_HEADLESS=1 MYMTS_NO_YTDLP_UPDATE=1 "$BIN" &
          PID=$!
          ok=""
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8091/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          [ -n "$ok" ] || { echo "SMOKE FAILED: the bundle did not serve /health"; exit 1; }
          echo "smoke OK: the bundled app serves /health headless"

      # --- package per OS ---
      - name: Package (macOS .app -> zip)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent tools/desktop/dist/MyMTS.app "tools/desktop/${{ matrix.artifact }}"

      - name: Package (Windows -> zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path tools/desktop/dist/MyMTS/* -DestinationPath "tools/desktop/${{ matrix.artifact }}"

      - name: Package (Linux -> tar.gz)
        if: runner.os == 'Linux'
        run: tar -C tools/desktop/dist -czf "tools/desktop/${{ matrix.artifact }}" MyMTS

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: tools/desktop/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: create draft GitHub Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the draft release + upload assets
    steps:
      # Checked out only so the release body can be read from CHANGELOG.md.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts
      # The body is the CHANGELOG section for this tag's version plus the fixed
      # notes below. A tag with no matching (or an empty) section fails the job
      # here, so no release is ever created with an empty or placeholder body.
      - name: Build release body from CHANGELOG
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          BODY="$RUNNER_TEMP/release-body.md"
          awk -v ver="$VER" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$BODY"
          if ! grep -q '[^[:space:]]' "$BODY"; then
            echo "::error::CHANGELOG.md has no non-empty '## [$VER]' section for tag $GITHUB_REF_NAME; refusing to create a release."
            exit 1
          fi
          cat >> "$BODY" <<'EOF'

          ---

          **The desktop builds are unsigned.**
          - macOS: Gatekeeper blocks the first launch. Right-click the app, choose Open, then confirm Open. This is needed once.
          - Windows: SmartScreen shows an unknown-publisher warning. Choose More info, then Run anyway. This is needed once.
          - Linux: not affected.

          **Android TV APK.** The APK is signed and attached manually after it has been verified. While this release is a draft, the APK is expected to be absent until that step is complete.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body_path: ${{ runner.temp }}/release-body.md
          # Created as a draft: not publicly visible until the signed APK is
          # attached and verified and the draft is published by hand.
          draft: true
          # Deliberate setting, not a default: releases are full releases. The
          # unsigned desktop builds are stated in the body instead.
          prerelease: false
