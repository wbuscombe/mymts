# Multi-OS desktop release — build the MyMTS desktop app on macOS / Windows /
# Linux with PyInstaller and, on a version tag, publish a GitHub Release with the
# three artifacts. This is ADDITIVE to ci.yml (tests + docs-hygiene stay intact).
#
# Triggers: a `v*` tag (publishes a Release) or manual dispatch (builds only).
# Signing/notarization is GATED on secrets — absent => unsigned artifacts (the
# build still succeeds). No secrets are printed.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: MyMTS-macos.zip
          - os: windows-latest
            artifact: MyMTS-windows.zip
          - os: ubuntu-latest
            artifact: MyMTS-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps (helper + build tooling)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ./helper                 # mymts_helper + fastapi/uvicorn/yt-dlp
          pip install pyinstaller pystray Pillow

      - name: Linux tray-import dep (so pystray imports during build)
        if: runner.os == 'Linux'
        run: pip install python-xlib

      - name: Build (PyInstaller)
        shell: bash
        working-directory: tools/desktop
        run: pyinstaller mymts-helper.spec --noconfirm --clean

      # --- signing, gated on secrets (unsigned fallback if unset) ---
      - name: Sign + notarize (macOS, gated)
        if: runner.os == 'macOS'
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash tools/desktop/sign-macos.sh tools/desktop/dist/MyMTS.app
        # NOTE: full signing in CI also requires importing the Developer ID cert
        # into the runner keychain — a follow-up when a cert exists. With no
        # identity, sign-macos.sh leaves the adhoc build and exits 0.

      - name: Sign (Windows, gated)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: pwsh tools/desktop/sign-windows.ps1 -Exe tools/desktop/dist/MyMTS/MyMTS.exe

      # --- package per OS ---
      - name: Package (macOS .app -> zip)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent tools/desktop/dist/MyMTS.app "tools/desktop/${{ matrix.artifact }}"

      - name: Package (Windows -> zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path tools/desktop/dist/MyMTS/* -DestinationPath "tools/desktop/${{ matrix.artifact }}"

      - name: Package (Linux -> tar.gz)
        if: runner.os == 'Linux'
        run: tar -C tools/desktop/dist -czf "tools/desktop/${{ matrix.artifact }}" MyMTS

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: tools/desktop/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release + upload assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          # Unsigned builds until a cert is configured -> mark as a pre-release.
          prerelease: true
          body: |
            MyMTS desktop — run the web wall with no clone, no Docker, no Python.

            Download for your OS, then open it (it runs as a menu-bar / tray app and
            opens the wall in your browser at http://127.0.0.1:8091/app/).

            These builds are currently **unsigned** (no code-signing cert configured):
            - macOS: right-click the app -> Open -> Open (once).
            - Windows: More info -> Run anyway (once).
            Signing/notarization activates automatically once a cert is provided.
