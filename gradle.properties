org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# MyMTS — default sustained tile budget for the Onn 4K (Amlogic S905Y4)
# device profile. Set as a Gradle property so the default is
# configuration-driven, not a hard-coded constant — re-homing to higher-
# capacity hardware is a property change, not a code change.
#
# Stage 2 Part C escalating-probe bracket (2026-06-01, see
# docs/findings/01-onn4k-tile-budget.md):
#   N=1..4 — all tiles LIVE, low drops, no recovery strikes (HEALTHY)
#   N=5    — dw-news-en tiles drop ~37% of frames (well above the 5%
#            threshold); redbull-tv tiles still healthy (DEGRADED)
#   N=6    — redbull-tv tiles begin firing recovery PREPARE strikes;
#            dw-news-en tiles never produce a first frame (DEGRADED)
#
# The measured-safe ceiling on this device profile is 4. Bracket-evidenced
# (1→6 sweep above) and 5.13h-LIVE-confirmed in the v2 long soak (run id
# long-soak-4t-v2-20260602-0857). This number is final for this hardware.
MYMTS_DEFAULT_MAX_TILES=4

# MyMTS — helper base URL. The TV consumes /api/channels + /api/feed from
# this address. Default points at the operator's NAS at <LAN_IP>:8091
# (Stage 2 Part A deploy). Overridable as a Gradle property at build time
# (e.g. for emulator / alternate-host development).
MYMTS_HELPER_BASE_URL=https://<LAN_IP>:8443
