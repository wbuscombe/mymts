org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# MyMTS — default sustained tile budget. Set as a Gradle property so the
# default is configuration-driven, not a hard-coded constant. The number
# itself is derived from docs/findings/01-onn4k-tile-budget.md once the
# soak gate clears. Until then, this is the placeholder used for the
# method-validation runs (the harness mode that proves the method works
# end-to-end).
MYMTS_DEFAULT_MAX_TILES=6
