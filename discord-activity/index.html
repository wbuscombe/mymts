<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MyMTS — News Wall</title>
  <!-- Build/version stamp — the `__MYMTS_BUILD_SHA__` placeholder is replaced with the
       running helper's git SHA at serve time (create_public_app), so "which version is
       Discord actually running?" is answerable by view-source, forever. -->
  <meta name="mymts-version" content="__MYMTS_BUILD_SHA__" />
  <!-- MyMTS Discord Activity — build __MYMTS_BUILD_SHA__ -->
  <!-- Own-origin CSP, same posture as /app/ + /control/. connect-src stays STRICT
       ('self' — all egress rides Discord's /.proxy/, no external host). script-src /
       style-src add 'unsafe-inline' ONLY so the JS-free failure bootstrap below renders
       under degraded conditions (a dead module, a blocked asset) — it is a trusted
       static bootstrap with no user-controlled HTML and no third-party origins. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: data:; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors https://discord.com https://*.discord.com https://*.discordsays.com" />

  <!-- Inline dark background FIRST, so an unstyled / asset-blocked / stale-CSS page is
       never a WHITE void (the failure this hardening removes). activity.css refines it. -->
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b0d; color: #e8e8ea;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #overlay { position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; text-align: center; padding: 1.25rem; }
    #booterror { position: fixed; left: 0; right: 0; bottom: 0; max-height: 50%;
      overflow: auto; margin: 0; padding: 0.6rem 0.8rem; background: #2a0e0e;
      color: #ffd7d7; font: 0.72rem/1.45 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre-wrap; word-break: break-all; display: none; z-index: 9; }
  </style>

  <!-- JS-free failure bootstrap — FIRST script in <head>, inline + dependency-free so
       it runs even when the module fails to load/parse (a stale/blocked asset or an
       early throw). Any uncaught error is written on-screen, so a dead module is never a
       silent white frame again. This is the layer BENEATH the ⓘ diagnostics overlay. -->
  <script>
    (function () {
      function show(msg) {
        var e = document.getElementById("booterror");
        if (!e) {
          e = document.createElement("pre");
          e.id = "booterror";
          (document.body || document.documentElement).appendChild(e);
        }
        e.style.display = "block";
        e.textContent = (e.textContent ? e.textContent + "\n" : "") + String(msg);
      }
      window.addEventListener("error", function (ev) {
        var m = (ev && (ev.message || (ev.error && ev.error.message))) || ev;
        if (ev && ev.filename) m = m + " @ " + ev.filename + ":" + ev.lineno;
        show("[boot error] " + m);
      });
      window.addEventListener("unhandledrejection", function (ev) {
        var r = ev && ev.reason;
        show("[boot rejection] " + ((r && (r.message || r)) || ev));
      });
    })();
  </script>

  <link rel="stylesheet" href="activity.css" />
  <!-- hls.js is the SAME pinned UMD bundle the LAN web client ships (window.Hls),
       loaded as a classic script before the module entry. -->
  <script src="vendor/hls.min.js"></script>
</head>
<body>
  <div id="stage">
    <!-- Full-bleed, contain-fit, muted autoplay so the wall always starts; a
         one-time "tap for sound" arms the mixed audio. -->
    <video id="wall" playsinline autoplay muted></video>
    <button id="unmute" type="button" aria-label="Enable sound">🔊 Tap for sound</button>
    <!-- Static default (shown until JS overrides): a dark loading state, never a white
         void. If JS never runs, this text stays — not an empty frame. -->
    <div id="overlay" role="status" aria-live="polite">MyMTS wall — loading…</div>
    <!-- In-frame diagnostics (no DevTools inside Discord): tap the corner badge to
         toggle; auto-shown on a fatal error. Names the failing URL/status so the
         operator can paste it back. Plain text only (no secrets, no console dump). -->
    <button id="diagbadge" type="button" aria-label="Show diagnostics">ⓘ</button>
    <pre id="diag" role="status" aria-live="polite"></pre>
  </div>
  <noscript><div id="overlay">MyMTS wall — this Activity needs JavaScript.</div></noscript>
  <script type="module" src="activity.mjs"></script>
</body>
</html>
