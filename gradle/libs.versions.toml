[versions]
# Toolchain — match WyzeGrid's validated combination (same Onn 4K target).
agp = "8.7.3"
kotlin = "2.0.0"

# AndroidX foundation
core-ktx = "1.13.1"
lifecycle = "2.8.7"
activity-compose = "1.9.3"

# Compose
compose-bom = "2024.11.00"
compose-tv-foundation = "1.0.0-alpha12"
compose-tv-material = "1.1.0-alpha01"

# Media
# Media3 1.5.0 — HLS only for MyMTS. WyzeGrid includes RTSP for cameras;
# MyMTS deliberately does not depend on RTSP, per the technical-approach
# hard boundary (no camera-auth model on the TV).
media3 = "1.5.0"

# Coil — image loader for the weather-radar WIDGET tiles (animated NWS loop GIFs).
# coil-gif's GifDecoder works on all API levels (minSdk 23), so the radar loop
# animates on the Onn box without an API-28 ImageDecoder gate. Radar is the first
# non-video widget kind the native wall renders (unified registry, 2026-07).
coil = "2.7.0"

# Test deps
junit = "4.13.2"
mockk = "1.13.13"
kotlinx-coroutines = "1.9.0"
turbine = "1.2.0"

# Test-only — real org.json impl (Android's bundled copy is a stub on the unit-test classpath)
org-json = "20240303"

# Debug-only
leakcanary = "2.14"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }

compose-tv-foundation = { group = "androidx.tv", name = "tv-foundation", version.ref = "compose-tv-foundation" }
compose-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "compose-tv-material" }

media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-gif = { group = "io.coil-kt", name = "coil-gif", version.ref = "coil" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
org-json = { group = "org.json", name = "json", version.ref = "org-json" }
leakcanary = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
